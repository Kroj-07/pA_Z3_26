AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  ArquiFusion Fleet Intelligence - Parte A - stack raíz (anida todos los stacks de la Parte A).
  Publica la configuración común en SSM (/arquifusion/{env}/root/) y, cuando cada
  IA entregue su plantilla, anida sus stacks. Cuenta tratada como Learner Lab:
  todos los recursos usan LabRole, solo us-east-1 y us-west-2.

Metadata:
  Proyecto: ArquiFusion Fleet Intelligence
  Responsable: IA-1 (Fundación)

Parameters:
  Env:
    Type: String
    AllowedValues:
      - shared
      - test
    Default: test
    Description: Entorno. "shared" es el compartido; "test" es el de pruebas.
  LabRoleName:
    Type: String
    Default: LabRole
    Description: Nombre del rol único del Learner Lab. Todos los recursos lo usan.
  PandasLayerArn:
    Type: String
    Default: ""
    Description: ARN de la capa AWS SDK for pandas (pyarrow). Ver scripts/resolve_pandas_layer.sh.
  GcpProjectId:
    Type: String
    Default: pendiente
    Description: Proyecto de Google Cloud (Parte B).
  AzureContainerUrl:
    Type: String
    Default: https://pendiente.blob.core.windows.net/af-backup
    Description: URL del contenedor de Azure Blob (sin SAS).
  AlarmEmail:
    Type: String
    Default: ""
    Description: Correo para las alarmas (vacío = sin suscripción).
  SesSenderEmail:
    Type: String
    Default: ""
    Description: Remitente verificado en SES (vacío = sin correo).
  IncidentWorkflowArn:
    Type: String
    Default: ""
    Description: ARN de SF-1 (Parte C). Vacío = la regla de incidentes no dispara nada.
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: Origen CORS de la API (la app de la Parte C).
  EnableGlobalTables:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Global Tables en Alerts e Incidents (solo en el primer despliegue; ver infra/data/README.md).
  EnableReplication:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Replicación de S3 a la otra región (requiere el stack réplica desplegado antes).

Rules:
  SoloRegionesDelLab:
    Assertions:
      - Assert:
          Fn::Contains:
            - - us-east-1
              - us-west-2
            - !Ref AWS::Region
        AssertDescription: Solo se permite us-east-1 y us-west-2 (Learner Lab).

Resources:
  # --- Configuración común, leída por las demás IAs desde SSM -----------------
  EnvParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /arquifusion/${Env}/root/env
      Type: String
      Value: !Ref Env
      Description: Nombre del entorno (shared o test).
      Tags:
        proyecto: arquifusion
        env: !Ref Env

  LabRoleArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /arquifusion/${Env}/root/lab-role-arn
      Type: String
      Value: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LabRoleName}
      Description: ARN de LabRole. Toda Lambda, máquina de estados y API lo usa como rol.
      Tags:
        proyecto: arquifusion
        env: !Ref Env

  RegionParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /arquifusion/${Env}/root/region
      Type: String
      Value: !Ref AWS::Region
      Description: Región donde se desplegó este stack raíz.
      Tags:
        proyecto: arquifusion
        env: !Ref Env

  # --- Stacks anidados (orden: seguridad y datos primero; observabilidad al final) ------
  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../security/template.yaml
      Parameters:
        Env: !Ref Env
        GcpProjectId: !Ref GcpProjectId
        AzureContainerUrl: !Ref AzureContainerUrl
      Tags:
          - { Key: proyecto, Value: arquifusion }
          - { Key: env, Value: !Ref Env }

  DataStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../data/template.yaml
      Parameters:
        Env: !Ref Env
        LabRoleArn: !GetAtt LabRoleArnParameter.Value
        EnableGlobalTables: !Ref EnableGlobalTables
        EnableReplication: !Ref EnableReplication
      Tags:
          - { Key: proyecto, Value: arquifusion }
          - { Key: env, Value: !Ref Env }

  IngestStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../ingest/template.yaml
      Parameters:
        Env: !Ref Env
        LabRoleName: !Ref LabRoleName
        PandasLayerArn: !Ref PandasLayerArn
      Tags:
          - { Key: proyecto, Value: arquifusion }
          - { Key: env, Value: !Ref Env }

  EventsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../api/events-template.yaml
      Parameters:
        Env: !Ref Env
        LabRoleName: !Ref LabRoleName
        SesSenderEmail: !Ref SesSenderEmail
        IncidentWorkflowArn: !Ref IncidentWorkflowArn
      Tags:
          - { Key: proyecto, Value: arquifusion }
          - { Key: env, Value: !Ref Env }

  ApiStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../api/template.yaml
      Parameters:
        Env: !Ref Env
        LabRoleName: !Ref LabRoleName
        AllowedOrigin: !Ref AllowedOrigin
      Tags:
          - { Key: proyecto, Value: arquifusion }
          - { Key: env, Value: !Ref Env }

  BridgeStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../bridge/template.yaml
      Parameters:
        Env: !Ref Env
        LabRoleArn: !GetAtt LabRoleArnParameter.Value
      Tags:
          - { Key: proyecto, Value: arquifusion }
          - { Key: env, Value: !Ref Env }

  Sf2Stack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../part-a/sf2/template.yaml
      Parameters:
        Env: !Ref Env
        LabRoleArn: !GetAtt LabRoleArnParameter.Value
      Tags:
          - { Key: proyecto, Value: arquifusion }
          - { Key: env, Value: !Ref Env }

  ObservabilityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../part-a/observability/template.yaml
      Parameters:
        Env: !Ref Env
        AlarmEmail: !Ref AlarmEmail
      Tags:
          - { Key: proyecto, Value: arquifusion }
          - { Key: env, Value: !Ref Env }


Outputs:
  IngestUrl:
    Description: POST de telemetria (Authorization Bearer de rol admin).
    Value: !GetAtt IngestStack.Outputs.IngestUrl
  Env:
    Description: Entorno desplegado.
    Value: !Ref Env
  LabRoleArn:
    Description: ARN de LabRole usado por todos los recursos.
    Value: !GetAtt LabRoleArnParameter.Value
  SsmPrefix:
    Description: Prefijo SSM de este entorno.
    Value: !Sub /arquifusion/${Env}/
